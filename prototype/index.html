<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061333">
  <title>数信 IM · 演示原型</title>
  <link rel="icon" href="./assets/app-icon.png" type="image/png">
  <link rel="stylesheet" href="./app.css?v=0.1.20">
  <script defer src="./vendor/vue.global.prod.js"></script>
  <script defer src="./vendor/icons.js?v=0.1.17"></script>
  <script defer src="./app.js?v=0.1.26"></script>
</head>
<body>
  <div class="workspace">
    <header class="demo-caption"><img src="./assets/app-icon.png" alt=""><strong>数信 IM</strong><span>演示原型 · 本地示例数据</span></header>
    <main id="app" class="phone" v-cloak>
      <div class="status" aria-hidden="true"><b>9:41</b><span><app-icon name="Signal"></app-icon><app-icon name="Wifi"></app-icon><app-icon name="BatteryFull"></app-icon></span></div>

      <template v-if="isAuth">
        <header class="auth-hero" :class="{ registration: page === 'register', 'login-hero': page === 'login' }">
          <button v-if="page === 'register'" class="glass-icon" aria-label="返回登录" @click="back('login')"><app-icon name="ChevronLeft"></app-icon></button>
          <h1>{{ titles[page] }}</h1>
        </header>
        <div class="auth-surface scroll">
          <form v-if="page === 'login'" class="form-stack compact auth-form" @submit.prevent="login">
            <label class="field"><app-icon name="Smartphone"></app-icon><input v-model.trim="auth.account" inputmode="tel" aria-label="手机号" placeholder="手机号" autocomplete="off"></label>
            <label class="field"><app-icon name="LockKeyhole"></app-icon><input v-model="auth.password" aria-label="密码" placeholder="密码" :type="showPassword ? 'text' : 'password'" autocomplete="off"><button type="button" class="icon-btn" :aria-label="showPassword ? '隐藏密码' : '显示密码'" @click="showPassword = !showPassword"><app-icon :name="showPassword ? 'Eye' : 'EyeOff'"></app-icon></button></label>
            <div class="captcha-row"><label class="field"><app-icon name="ShieldCheck"></app-icon><input v-model.trim="auth.code" inputmode="numeric" maxlength="4" aria-label="验证码" placeholder="验证码" autocomplete="off"></label><button type="button" class="captcha" aria-label="刷新验证码" @click="refreshLoginCaptcha"><b>{{ loginCaptcha }}</b><app-icon name="RotateCw"></app-icon></button></div>
            <p v-if="loginError" class="error" role="alert">{{ loginError }}</p>
            <div class="auth-links"><button type="button" class="text-btn" @click="open('login-network')">线路选择</button><button type="button" class="text-btn" @click="open('account-recovery')">找回账号密码</button></div>
            <div class="actions auth-actions"><button type="button" class="secondary" @click="open('register')">注册</button><button class="primary" type="submit">登录</button></div>
            <auth-agreement v-model="auth.agreement" page="login" @open-document="documentPage => open(documentPage)"></auth-agreement>
            <p class="auth-version">{{ appVersion }}</p>
          </form>
          <form v-else class="form-stack compact auth-form" @submit.prevent="register">
            <input ref="signupAvatarInput" type="file" accept="image/*" hidden @change="chooseSignupAvatar">
            <button type="button" class="signup-avatar" aria-label="设置头像" @click="signupAvatarInput.click()"><img v-if="signup.avatar" :src="signup.avatar" alt=""><app-icon v-else name="UserRound"></app-icon><span><app-icon name="Camera"></app-icon></span></button>
            <label class="field"><app-icon name="Smartphone"></app-icon><input v-model.trim="signup.phone" inputmode="tel" aria-label="手机号" placeholder="手机号" autocomplete="off"></label>
            <label class="field"><app-icon name="UserRound"></app-icon><input v-model.trim="signup.nickname" aria-label="昵称" placeholder="昵称" autocomplete="off"></label>
            <label class="field"><app-icon name="LockKeyhole"></app-icon><input v-model="signup.password" :type="showSignupPassword ? 'text' : 'password'" aria-label="密码" placeholder="密码（6-20位）" autocomplete="off"><button type="button" class="icon-btn" :aria-label="showSignupPassword ? '隐藏密码' : '显示密码'" @click="showSignupPassword = !showSignupPassword"><app-icon :name="showSignupPassword ? 'Eye' : 'EyeOff'"></app-icon></button></label>
            <label class="field"><app-icon name="LockKeyhole"></app-icon><input v-model="signup.confirm" :type="showSignupConfirm ? 'text' : 'password'" aria-label="确认密码" placeholder="确认密码" autocomplete="off"><button type="button" class="icon-btn" :aria-label="showSignupConfirm ? '隐藏确认密码' : '显示确认密码'" @click="showSignupConfirm = !showSignupConfirm"><app-icon :name="showSignupConfirm ? 'Eye' : 'EyeOff'"></app-icon></button></label>
            <label class="field"><app-icon name="Ticket"></app-icon><input v-model.trim="signup.invite" :aria-label="inviteLabel" :placeholder="inviteLabel" autocomplete="off"></label>
            <div class="captcha-row"><label class="field"><app-icon name="ShieldCheck"></app-icon><input v-model.trim="signup.code" inputmode="numeric" maxlength="4" aria-label="验证码" placeholder="验证码" autocomplete="off"></label><button type="button" class="captcha" aria-label="刷新验证码" @click="refreshCaptcha"><b>{{ captcha }}</b><app-icon name="RotateCw"></app-icon></button></div>
            <p v-if="registerError" class="error" role="alert">{{ registerError }}</p>
            <auth-agreement v-model="signup.agreement" page="register" @open-document="documentPage => open(documentPage)"></auth-agreement>
            <div class="actions auth-actions"><button type="button" class="secondary" @click="back('login')">登录</button><button class="primary" type="submit">注册</button></div>
          </form>
        </div>
      </template>

      <template v-else>
        <header class="app-header" :class="{ 'detail-header': !isTab, 'chat-header': page === 'chat' }">
          <button v-if="!isTab" class="glass-icon" aria-label="返回" @click="back(parentPages[page])"><app-icon name="ChevronLeft"></app-icon></button>
          <div v-if="page === 'chat'" class="avatar header-avatar">{{ activePerson.avatar }}</div>
          <h1 v-if="page === 'chat' && activePerson.group"><button class="chat-group-title" @click="open('group-info', activePerson.id)">{{ title }}<small>{{ currentGroup?.members.length || 0 }} 位成员</small></button></h1>
          <h1 v-else>{{ page === 'messages' && chatSelecting ? (selectedChats.size ? '已选择 ' + selectedChats.size : '选择聊天') : title }}</h1>
          <div class="header-actions">
            <template v-if="page === 'messages'">
              <template v-if="chatSelecting"><button class="header-text" @click="toggleChatSelection">完成</button><button class="header-text" @click="selectAllChats">{{ visibleChatsSelected ? '取消全选' : '全选' }}</button></template>
              <template v-else>
                <button class="glass-icon" aria-label="联系客服" title="联系客服" @click="open('support')"><app-icon name="Headset"></app-icon></button>
                <button class="glass-icon" aria-label="选择聊天" @click="toggleChatSelection"><app-icon name="Check"></app-icon></button>
              </template>
            </template>
            <button v-if="page === 'check-in'" class="glass-icon" aria-label="签到规则" @click="modal = 'check-rule'"><app-icon name="CircleHelp"></app-icon></button>
            <button v-if="page === 'native-check'" class="header-text" @click="modal = 'subsidy-rules'"><app-icon name="CircleHelp"></app-icon>规则</button>
            <button v-if="page === 'chat'" class="glass-icon" aria-label="搜索" @click="open('chat-history', activePerson.id)"><app-icon name="Search"></app-icon></button>
            <button v-if="page === 'chat'" class="glass-icon" aria-label="更多" @click="activePerson.group ? modal = 'chat-actions' : open('chat-tools',activePerson.id)"><app-icon name="Ellipsis"></app-icon></button>
            <button v-if="page === 'groups'" class="glass-icon" aria-label="新建群组" @click="openGroupCreation"><app-icon name="Plus"></app-icon></button>
            <template v-if="page === 'square'">
              <button class="glass-icon" aria-label="发布动态" @click="openSquarePost"><app-icon name="Plus"></app-icon></button>
              <button class="glass-icon" aria-label="动态通知" @click="open('square-notices')"><app-icon name="Bell"></app-icon></button>
              <button class="glass-icon" aria-label="搜索" @click="squareQuery = ''; open('square-search')"><app-icon name="Search"></app-icon></button>
            </template>
            <button v-if="page === 'square-post'" class="header-text" :disabled="!squareDraft.text.trim() && !squareDraft.attachment" @click="publishSquarePost">发布</button>
          </div>
        </header>

        <div v-if="page === 'messages' || page === 'contacts'" class="search-wrap">
          <label class="field search"><app-icon name="Search"></app-icon><input v-model="search" aria-label="搜索" placeholder="搜索"></label>
          <div v-if="page === 'messages'" class="section-tabs chat-category-tabs" role="group" aria-label="聊天分类">
            <button v-for="[value, label] in [['all','全部'],['contact','联系人'],['group','群组']]" :key="value" :aria-pressed="chatFilter === value" @click="chatFilter = value">{{ label }}</button>
          </div>
        </div>
        <div v-if="page === 'settings'" class="section-tabs settings-tabs" role="group" aria-label="通知·设备·网络">
          <button v-for="section in settingsTabs" :key="section" :aria-pressed="settingsSection === section" @click="settingsSection = section">{{ titles[section] }}</button>
        </div>

        <div class="surface scroll" :class="{ 'chat-surface': page === 'chat', 'group-surface': page === 'group' }" ref="surface">
          <template v-if="page === 'messages'">
            <button v-for="person in foundConversations" :key="person.id" class="row conversation" :class="{ pinned: person.pinned, 'chat-selected': selectedChats.has(person.id) }" :aria-pressed="chatSelecting ? selectedChats.has(person.id) : undefined" :aria-haspopup="chatSelecting ? undefined : 'dialog'" @click="!modal && (chatSelecting ? toggleSelectedChat(person.id) : enterChat(person.id))" @contextmenu.prevent="showConversationMenu(person)" @keydown.shift.f10.prevent="showConversationMenu(person)" @pointerdown="startConversationPress(person, $event)" @pointerup="cancelMessagePress" @pointercancel="cancelMessagePress" @pointerleave="cancelMessagePress" @pointermove="moveMessagePress">
              <span v-if="chatSelecting" class="chat-select-indicator">{{ selectedChats.has(person.id) ? '✓' : '' }}</span>
              <span class="avatar" :class="[person.color,{ squared: person.group }]"><img v-if="person.avatarImage" :src="person.avatarImage" alt=""><app-icon v-else-if="person.group" name="UsersRound"></app-icon><template v-else>{{ person.avatar }}</template></span>
              <span class="row-info"><strong>{{ person.name }} <app-icon v-if="person.pinned" name="Pin"></app-icon><span v-if="conversationMuted(person)" role="img" aria-label="已静音"><app-icon name="Bell"></app-icon></span></strong><span>{{ lastMessage(person.id) }}</span></span>
              <span class="row-meta"><span>{{ person.time }}</span><b v-if="person.unread" class="badge">{{ person.unread }}</b></span>
            </button>
            <p v-if="!foundConversations.length" class="empty">{{ search ? '无搜索结果' : '暂无消息' }}</p>
          </template>

          <template v-else-if="page === 'contacts'">
            <div v-if="!search" class="contact-actions">
              <button @click="open('requests')"><span class="tile"><app-icon name="UserRoundPlus"></app-icon></span>新的朋友</button>
              <button @click="open('add-friend')"><span class="tile"><app-icon name="Search"></app-icon></span>添加好友</button>
              <button @click="openGroupCreation"><span class="tile teal"><app-icon name="UsersRound"></app-icon></span>新建群组</button>
            </div>
            <div v-for="section in contactSections" :key="section.letter" class="contact-group">
              <div class="letter">{{ section.letter }}</div>
              <button v-for="person in section.people" :key="person.id" class="row slim" @click="open('contact',person.id)"><span class="avatar" :class="person.color">{{ person.avatar }}</span><span class="grow">{{ person.name }}</span></button>
            </div>
            <div v-if="!contactSections.length" class="empty"><strong>{{ search ? '无搜索结果' : '还没有联系人' }}</strong><p v-if="!search">点击右上角添加新朋友</p></div>
          </template>

          <template v-else-if="page === 'group'">
            <button class="promo" @click="open('promo')">
              <span class="promo-copy"><strong>激活数据新动能</strong><small>宣传片 · 演示视频</small></span>
              <span class="promo-play"><app-icon name="Play"></app-icon></span>
            </button>
            <section class="intro"><h2>国家数据集团介绍</h2><p>国家数据集团有限公司于 2026 年 10 月在河北雄安新区成立，以数据资源开发利用为主责主业。集团推动数据有序汇聚、安全流通和高效应用，服务人工智能发展与产业协同。</p></section>
            <section class="news"><h2>新闻资料</h2>
              <button v-for="item in news" :key="item.id" class="row" @click="open('news',item.id)"><img :src="item.image" alt=""><span class="row-info"><strong>{{ item.title }}</strong><span>{{ item.date }} · {{ item.source }}</span></span><app-icon name="ChevronRight"></app-icon></button>
            </section>
          </template>

          <template v-else-if="page === 'check-in'">
            <button class="glass-card check-summary" @click="open('check-records')"><span><span>我的积分</span><strong>{{ amount }}</strong><small>积分明细 <app-icon name="ChevronRight"></app-icon></small></span><span><span>连续签到</span><strong>{{ streak }}<small>天</small></strong></span></button>
            <section class="calendar">
              <div class="calendar-head"><strong>{{ calendarTitle }}</strong><button class="icon-btn" aria-label="上月" @click="viewMonth(-1)"><app-icon name="ChevronLeft"></app-icon></button><button class="icon-btn" aria-label="下月" @click="viewMonth(1)"><app-icon name="ChevronRight"></app-icon></button></div>
              <div class="calendar-grid"><span v-for="day in week" :key="day" class="weekday">{{ day }}</span><span v-for="day in calendar" :key="day.key" :class="{ marked: day.signed, today: day.today }">{{ day.number || '' }}</span></div>
              <p class="check-month"><span>本月签到</span><b>{{ monthCount }} 天</b></p>
            </section>
            <p v-if="cycleDays" class="row slim"><span class="grow">连续签到奖励</span><b>{{ Math.min(streak, cycleDays) }} / {{ cycleDays }} 天</b></p>
            <button class="primary check-button" :class="{ signed }" :disabled="signed || checkBusy" :aria-busy="checkBusy" @click="checkIn"><app-icon v-if="signed" name="Check"></app-icon>{{ signed ? '今日已签到' : '签到' }}</button>
          </template>
          <template v-else-if="page === 'native-check'">
            <section class="glass-card wallet-card">
              <span>{{ subsidyClaimed ? '今日已签到' : '今日还未签到' }}</span>
              <strong>{{ subsidyStreak }} 天</strong><span>连续签到</span>
              <button class="secondary" :disabled="subsidyClaimed" @click="checkInForSubsidy">签到</button>
              <span>本周期已签 {{ subsidyCycleDays }} / 30 天</span>
              <button v-if="subsidyCycleDays === 30" class="secondary" @click="claimSubsidyReward">领取 30 天签到奖励</button>
              <span v-else>再签 {{ 30 - subsidyCycleDays }} 天得 3000 元</span>
            </section>
            <div class="actions"><div class="row"><span class="grow">累计签到</span>{{ subsidySignedDates.size }} 天</div><div class="row"><span class="grow">本月签到</span>{{ subsidyMonthCount }} 天</div></div>
            <section class="calendar">
              <div class="calendar-head"><strong>{{ calendarTitle }}</strong><button class="icon-btn" aria-label="上月" @click="viewMonth(-1)"><app-icon name="ChevronLeft"></app-icon></button><button class="icon-btn" aria-label="下月" @click="viewMonth(1)"><app-icon name="ChevronRight"></app-icon></button></div>
              <div class="calendar-grid"><span v-for="day in week" :key="day" class="weekday">{{ day }}</span><span v-for="day in calendar" :key="day.key" :class="{ marked: day.signed, today: day.today }">{{ day.number || '' }}</span></div>
            </section>
            <button class="row" @click="open('subsidy-wallet')"><span class="grow">补贴明细</span><app-icon name="ChevronRight"></app-icon></button>
          </template>

          <template v-else-if="page === 'profile'">
            <div class="glass-card profile-card">
              <div class="personal">
                <button class="profile-details-button" aria-label="编辑资料" @click="editProfile"></button>
                <span class="avatar"><img v-if="profile.avatar" :src="profile.avatar" alt=""><template v-else>{{ profile.nickname[0] }}</template></span>
                <div class="row-info">
                  <div class="profile-nickname"><strong>{{ profile.nickname }}</strong><button class="glass-icon profile-nickname-edit" aria-label="修改昵称" @click="openNicknameEditor"><app-icon name="Pencil"></app-icon></button></div>
                  <span>{{ profile.bio || '个性签名' }}</span>
                </div>
              </div>
              <button class="glass-icon" aria-label="二维码" @click="open('profile-qr')"><app-icon name="Scan"></app-icon></button>
            </div>
            <div class="profile-shortcuts">
              <button @click="open('points-shop')"><span class="tile"><app-icon name="Coins"></app-icon></span>积分商城</button>
              <button @click="open('lucky-draw')"><span class="tile"><app-icon name="Ticket"></app-icon></span>幸运抽奖</button>
            </div>
            <template v-for="item in profileLinks" :key="item.page">
              <button class="row profile-row" @click="item.page === 'password-menu' ? openPasswordModal() : open(item.page)"><app-icon :name="item.icon"></app-icon><span class="grow">{{ item.title }}</span><strong v-if="item.page === 'wallet'" class="balance">¥ {{ walletBalance }}</strong><app-icon name="ChevronRight"></app-icon></button>
            </template>
            <div class="row profile-row"><app-icon name="Info"></app-icon><span class="grow">版本号</span><span class="muted">{{ appVersion }}</span></div>
            <button class="secondary profile-logout" @click="modal = 'logout'"><app-icon name="LogOut"></app-icon>退出登录</button>
          </template>

          <template v-else-if="page === 'chat'">
            <div v-for="message in activeMessages" :key="message.id" class="message-line" :class="{ mine: message.mine, timestamp: message.kind === 'time', 'message-selecting': selectingMessages && message.kind !== 'time', 'message-selected': selectedMessageIds.has(message.id) }">
              <span v-if="message.kind === 'time'">{{ message.text }}</span>
              <template v-else>
                <button v-if="selectingMessages" type="button" class="message-select-button" :aria-label="'选择消息 ' + message.text" :aria-pressed="selectedMessageIds.has(message.id)" @click="toggleMessageSelection(message.id)"><span aria-hidden="true">{{ selectedMessageIds.has(message.id) ? '✓' : '' }}</span></button>
                <span class="avatar"><img v-if="message.mine && profile.avatar" :src="profile.avatar" alt=""><template v-else>{{ message.mine ? profile.nickname[0] : (message.sender?.[0] || activePerson.avatar) }}</template></span>
                <div class="message-stack" :inert="selectingMessages || undefined">
                  <span v-if="activePerson.group && !message.mine && message.sender" class="message-sender">{{ message.sender }}</span>
                  <button v-if="message.kind === 'file'" class="bubble attachment" @click="openAttachment(message)"><span class="tile"><app-icon name="FileText"></app-icon></span><span class="row-info"><strong>{{ message.text }}</strong><span>{{ message.size }}</span></span></button>
                  <button v-else-if="message.kind === 'image'" class="bubble image-bubble" aria-label="图片预览" @click="previewPicture(message)"><img :src="message.url" alt="图片"><small v-if="message.original">原图</small></button>
                  <button v-else-if="message.kind === 'voice'" class="bubble call-record" :aria-pressed="playingVoiceId === message.id" @click="playVoice(message)"><app-icon :name="playingVoiceId === message.id ? 'Mic' : 'Play'"></app-icon><span>语音消息 <small>{{ message.duration }}</small></span></button>
                  <button v-else-if="message.kind === 'red'" class="bubble envelope" :class="{ 'envelope-seen': message.claimed }" @click="selectEnvelope(message)"><span class="packet-icon" aria-hidden="true">🧧</span><span class="envelope-message"><strong>{{ redCaption(message) }}</strong><small>{{ message.claimed ? '已领取' : message.mine ? '发出红包' : '领取红包' }}</small></span></button>
                  <span v-else-if="message.kind === 'call'" class="bubble call-record"><app-icon :name="message.callType === 'video' ? 'Video' : 'Mic'"></app-icon><span>{{ message.text }}<small v-if="message.duration">通话时长 {{ message.duration }}</small></span></span>
                  <span v-else-if="message.kind === 'recalled'" class="bubble recalled">{{ message.text }}</span>
                  <div v-else class="message-content">
                    <span class="bubble actionable" tabindex="0" aria-haspopup="dialog" @contextmenu.prevent="showMessageMenu(message)" @keydown.shift.f10.prevent="showMessageMenu(message)" @pointerdown="startMessagePress(message, $event)" @pointerup="cancelMessagePress" @pointercancel="cancelMessagePress" @pointerleave="cancelMessagePress" @pointermove="moveMessagePress"><span v-if="message.reply" class="message-quote"><strong>{{ message.reply.author }}</strong><span>{{ message.reply.text }}</span></span>{{ message.text }}</span>
                    <span v-if="message.delivery === 'sending'" class="delivery-pending" role="status" aria-label="发送"></span>
                    <button v-if="message.delivery === 'failed'" class="delivery-failed" aria-label="重试" @click="retryMessage(message)">发送失败，请重试</button>
                  </div>
                  <div v-if="message.time" class="message-meta">
                    <time>{{ message.time }}</time>
                    <span v-if="message.mine && message.kind === 'text' && (message.delivery === 'sent' || message.delivery === 'read')" class="message-sent" :class="{ 'message-read': message.delivery === 'read' }" role="img" :aria-label="message.delivery === 'read' ? '已读' : '已发送'"><app-icon name="Check"></app-icon><app-icon v-if="message.delivery === 'read'" name="Check"></app-icon></span>
                  </div>
                  <div v-if="message.reactions?.length" class="message-reaction-chips"><span v-for="reaction in message.reactions" :key="reaction.glyph" role="img" :aria-label="'表情回应 ' + reaction.label">{{ reaction.glyph }}</span></div>
                </div>
              </template>
            </div>
          </template>

          <template v-else-if="page === 'call'">
            <div v-if="activeCall" class="call-stage glass-card">
              <span class="avatar" :class="activePerson.color">{{ activePerson.avatar }}</span>
              <h2>{{ activePerson.name }}</h2>
              <p role="status">{{ activeCall.phase === 'calling' ? '呼叫中' : activeCall.phase === 'connected' ? '通话中' : title }}</p>
              <p v-if="activeCall.phase === 'connected'" class="call-duration">{{ callDuration }}</p>
            </div>
            <div v-if="activeCall?.phase === 'incoming'" class="meeting-actions">
              <button class="secondary" @click="finishCall('已拒绝')">拒绝</button><button class="primary" @click="connectCall">接听</button>
            </div>
            <button v-else-if="activeCall?.phase === 'calling'" class="logout" @click="finishCall('呼叫已取消')">取消</button>
            <template v-else-if="activeCall?.phase === 'connected'">
              <div class="meeting-actions">
                <button class="secondary call-control" :aria-pressed="activeCall.muted" @click="activeCall.muted = !activeCall.muted"><app-icon name="Mic"></app-icon>静音</button>
                <button v-if="activeCall.type === 'video'" class="secondary call-control" :aria-pressed="!activeCall.cameraEnabled" @click="activeCall.cameraEnabled = !activeCall.cameraEnabled"><app-icon name="Video"></app-icon>摄像头</button>
              </div>
              <button class="logout" @click="finishCall('通话结束')">挂断</button>
            </template>

          <div v-if="chatPanel === 'emoji'" class="composer-panel emoji-panel"><button v-for="emoji in emojis" :key="emoji" @click="draft += emoji">{{ emoji }}</button></div>
          <div v-if="pendingPictures.length" class="pending-pictures">
            <div class="picture-strip"><div v-for="(picture, index) in pendingPictures" :key="picture.id" class="pending-tile">
              <button type="button" :aria-label="'预览 ' + (index+1)" @click="previewPicture(picture)"><img :src="picture.url" alt="图片"></button>
              <button type="button" class="remove-picture" :aria-label="'移除 ' + (index+1)" :disabled="picturesBusy" @click="removePendingPicture(picture)"><app-icon name="X"></app-icon></button>
            </div></div>
            <div class="picture-actions"><label><input type="checkbox" v-model="sendOriginal" :disabled="picturesBusy">原图</label><button type="button" class="send" :disabled="picturesBusy" @click="sendPendingPictures">发送（{{ pendingPictures.length }}）</button></div>
          </div>
          <div v-if="voiceMode" class="compose-line recording-line">
            <button class="glass-icon" aria-label="取消录音" @click="stopVoiceCapture(false)"><app-icon name="ChevronLeft"></app-icon></button>
            <span class="recording-gesture" @pointerdown="startVoiceGesture" @pointerup="releaseVoiceCapture" @pointercancel="stopVoiceCapture(false)">← 滑动取消 <b>{{ voiceElapsed }}</b></span>
            <button class="send" @click="stopVoiceCapture(true)">发送</button>
          </div>
          <form v-else class="compose-line" @submit.prevent="sendMessage">
            <button type="button" class="glass-icon" aria-label="更多" @click="toggleChatPanel('files')"><app-icon name="Plus"></app-icon></button>
            <input ref="composerInput" v-model="draft" aria-label="Aa" placeholder="Aa" @focus="chatPanel = ''">
            <button type="button" class="glass-icon" aria-label="表情" @click="toggleChatPanel('emoji')"><app-icon name="Smile"></app-icon></button>
            <button v-if="!draft.trim()" type="button" class="glass-icon" aria-label="语音" @click="toggleVoiceMode"><app-icon name="Mic"></app-icon></button>
            <button v-else class="send" type="submit">发送</button>
          </form>
          <input ref="fileInput" type="file" hidden @change="attachFile">
        </div>

        <nav v-if="isTab" class="tabbar" aria-label="主导航">
          <button v-for="tab in tabs" :key="tab.page" :aria-current="page === tab.page ? 'page' : undefined" @click="switchTab(tab.page)"><span class="tab-icon"><app-icon :name="tab.icon"></app-icon></span><span>{{ tab.label }}</span></button>
        </nav>
      </template>

      <div class="system-home" :class="{ light: isTab || page === 'chat' }" aria-hidden="true"><span></span></div>

      <div v-if="modal" class="overlay" @click.self="modal = ''">
        <div class="dialog" role="dialog" aria-modal="true" :aria-label="dialogTitle">
          <h2 v-if="modal !== 'conversation-menu'">{{ dialogTitle }}</h2>
          <template v-if="modal === 'chat-actions'">
            <button class="row" @click="open('chat-history', activePerson.id)">搜索</button>
            <button class="row" @click="open('saved-messages')">收藏</button>
            <button v-if="!isGroupOwner" class="row" @click="modal = 'leave-group'">退出群组</button>
          </template>
          <template v-else-if="modal === 'shared-groups'"><button v-for="shared in sharedGroups" :key="shared.id" class="row" @click="open('group-info', shared.id)">{{ shared.name }}</button><p v-if="!sharedGroups.length" class="empty">暂无共同群组</p></template>
          <template v-else-if="modal === 'conversation-menu'">
            <button class="row" @click="conversationTarget.unread = conversationTarget.unread ? 0 : 1; modal = ''"><span class="grow">{{ conversationTarget.unread ? '标记为已读' : '标记为未读' }}</span><app-icon name="MessageCircle"></app-icon></button>
            <button class="row" @click="conversationTarget.pinned = !conversationTarget.pinned; modal = ''"><span class="grow">{{ conversationTarget.pinned ? '取消置顶' : '置顶' }}</span><app-icon name="Pin"></app-icon></button>
            <button class="row" @click="toggleConversationMute"><span class="grow">{{ conversationMuted(conversationTarget) ? '取消静音' : '静音' }}</span><app-icon name="Bell"></app-icon></button>
            <button class="row" @click="modal = 'remove-conversation'"><span class="grow">删除</span></button>
          </template>
          <template v-else-if="modal === 'batch-remove' || modal === 'remove-conversation'"><p>聊天将从列表中移除，但不会删除聊天记录</p><div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" @click="modal === 'batch-remove' ? applyChatBatch(true) : removeConversation()">删除</button></div></template>
          <template v-else-if="modal === 'square-audience'">
            <button v-for="[label, description] in squareAudiences" :key="label" class="row" @click="pickSquareAudience(label)"><span class="row-info"><strong>{{ label }}</strong><span>{{ description }}</span></span><app-icon v-if="squareDraft.audience === label" name="Check"></app-icon></button>
          </template>
          <template v-else-if="modal === 'square-audience-people'">
            <label v-for="person in squareContacts" :key="person.id" class="row"><span class="grow">{{ person.name }}</span><input type="checkbox" :checked="squareAudience.has(person.id)" @change="selectSquarePerson(person.id)"></label>
            <button class="primary" :disabled="!squareAudience.size" @click="confirmSquareAudience">确定</button>
          </template>
          <template v-else-if="modal === 'square-emoji'"><div class="emoji-panel"><button v-for="emoji in emojis" :key="emoji" @click="squareDraft.text += emoji; modal = ''">{{ emoji }}</button></div></template>
          <template v-else-if="modal === 'square-topic'"><form class="form-stack" @submit.prevent="squareDraft.text += '#' + squareTopic + ' '; modal = ''"><label class="labeled">话题<input v-model.trim="squareTopic" required></label><button class="primary">确定</button></form></template>
          <template v-else-if="modal === 'square-mention'"><button v-for="person in squareContacts" :key="person.id" class="row" @click="squareDraft.text += '@' + person.name + ' '; modal = ''">{{ person.name }}</button></template>
          <template v-else-if="modal === 'notification-tone'">
            <p class="muted">点击播放预览</p>
            <div v-for="(asset, tone) in notificationTones" :key="tone" class="row">
              <button v-if="asset" class="icon-btn" :aria-label="'预览' + tone" @click="playTone(tone)"><app-icon name="Play"></app-icon></button>
              <button class="grow tone-choice" :aria-pressed="notificationTone === tone" @click="notificationTone = tone; modal = ''">{{ tone }} <app-icon v-if="notificationTone === tone" name="Check"></app-icon></button>
            </div>
          </template>
          <template v-else-if="modal === 'change-password'">
            <div class="section-tabs" role="group" aria-label="密码类型"><button :aria-pressed="passwordMode === 'password'" @click="openPasswordModal('password')">登录密码</button><button :aria-pressed="passwordMode === 'pay-password'" @click="openPasswordModal('pay-password')">支付密码</button></div>
            <form class="form-stack compact" @submit.prevent="savePassword">
              <label v-for="[field, label] in [['old','请输入原密码'],['first', passwordMode === 'password' ? '请输入新密码（6–20位）' : '请输入6位支付密码'],['confirm','请再次输入新密码']]" v-show="field !== 'old' || passwordMode === 'password' || payConfigured" :key="field" class="field">
                <input v-model="passwordDraft[field]" :type="visiblePasswords.has(field) ? 'text' : 'password'" :placeholder="label" :aria-label="label" autocomplete="off">
                <button class="icon-btn" type="button" :aria-label="(visiblePasswords.has(field) ? '隐藏' : '显示') + label" @click="togglePasswordField(field)"><app-icon :name="visiblePasswords.has(field) ? 'Eye' : 'EyeOff'"></app-icon></button>
              </label>
              <p v-if="passwordMode === 'password'" class="muted">修改成功后需要用新密码重新登录</p>
              <p v-if="passwordError" class="error" role="alert">{{ passwordError }}</p>
              <div class="actions"><button type="button" class="secondary" @click="modal = ''">取消</button><button class="primary">确认修改</button></div>
            </form>
          </template>
          <template v-else-if="modal === 'subsidy-rules'">
            <p>每位用户每日仅限签到 1 次。签到可获得 500 元全民补贴。</p>
            <p>用户连续签到满 30 天，可额外获取一次「30 天签到奖励」，3000 元全民补贴。中断一天则重新累计。</p>
            <p>30 天签到奖励领取后，重新开始计算下一周期。漏签不扣除已获得的奖励，但漏签将重新累计签到天数。</p>
            <button class="primary" @click="modal = ''">知道了</button>
          </template>
          <template v-else-if="modal === 'logout'"><div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" @click="logout">确定</button></div></template>
          <template v-else-if="modal === 'leave-meeting'"><div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" @click="leaveMeeting">确定</button></div></template>
          <template v-else-if="modal === 'join-meeting'"><form class="form-stack" @submit.prevent="joinMeeting()"><label class="labeled"><input v-model.trim="meetingCode" inputmode="numeric" aria-label="9 位会议号" placeholder="9 位会议号" maxlength="9"></label><p v-if="meetingError" class="error" role="alert">{{ meetingError }}</p><div class="actions"><button type="button" class="secondary" @click="modal = ''">取消</button><button class="primary">加入</button></div></form></template>
          <template v-else-if="modal === 'meeting-duration'"><button v-for="minutes in meetingDurations" :key="minutes" class="row" @click="meetingDraft.duration = minutes; modal = ''"><span class="grow">{{ minutes / 60 }} 小时</span><app-icon v-if="meetingDraft.duration === minutes" name="Check"></app-icon></button></template>
          <template v-else-if="modal === 'meeting-start'"><button class="row" @click="meetingDraft.immediate = true; modal = ''"><span class="grow">立即开始</span><app-icon v-if="meetingDraft.immediate" name="Check"></app-icon></button><button v-for="slot in nextMeetingSlots" :key="slot" class="row" @click="meetingDraft.immediate = false; meetingDraft.start = slot; modal = ''"><span class="grow">{{ formatMeetingSlot(slot) }}</span><app-icon v-if="!meetingDraft.immediate && meetingDraft.start === slot" name="Check"></app-icon></button></template>
          <template v-else-if="modal === 'end-meeting'"><div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" @click="endMeeting">确定</button></div></template>
          <template v-else-if="modal === 'reset-notifications'"><p>确定要将所有通知设置恢复为默认值吗？</p><div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" @click="resetNotifications">重置</button></div></template>
          <template v-else-if="modal === 'end-other-devices'"><div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" @click="endOtherDevices">确定</button></div></template>
          <template v-else-if="modal === 'end-device'"><div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" @click="endDevice">确定</button></div></template>
          <template v-else-if="modal === 'check-rule'"><check-rules></check-rules><button class="primary" @click="modal = ''">确定</button></template>
          <template v-else-if="modal === 'picture-preview'"><img class="full-preview" :src="picturePreview.url" alt="图片"><button class="primary" @click="modal = ''">确定</button></template>
          <template v-else-if="modal === 'create-group'">
            <form class="form-stack" @submit.prevent="createGroup">
              <button type="button" class="avatar squared new-group-avatar" aria-label="设置群头像" @click="groupAvatarInput.click()"><img v-if="groupDraft.avatar" :src="groupDraft.avatar" alt=""><app-icon v-else name="Camera"></app-icon></button>
              <input ref="groupAvatarInput" type="file" accept="image/*" hidden @change="selectGroupAvatar">
              <label class="labeled"><input v-model.trim="groupDraft.name" aria-label="输入群名" placeholder="输入群名" maxlength="64"></label>
              <div class="section-tabs" role="group" aria-label="群组可见性"><button v-for="option in ['公开','私密']" :key="option" type="button" :aria-pressed="groupDraft.visibility === option" @click="groupDraft.visibility = option">{{ option }}</button></div>
              <label class="field"><app-icon name="Search"></app-icon><input v-model.trim="groupDraft.search" aria-label="搜索联系人" placeholder="搜索联系人"></label>
              <div v-if="!filteredGroupCandidates.length" class="empty"><strong>暂无可邀请的好友</strong><p>请先添加好友后再来这里创建群聊</p><button type="button" class="text-btn" @click="groupDraft.search = ''">刷新联系人</button></div>
              <fieldset v-else class="group-selection"><legend>选择成员</legend><label v-for="person in filteredGroupCandidates" :key="person.id" class="row slim"><input type="checkbox" v-model="groupDraft.memberIds" :value="person.id"><span>{{ person.name }}</span></label></fieldset>
              <div class="actions"><button type="button" class="secondary" @click="modal = ''">取消</button><button class="primary" :disabled="!groupDraft.name || !groupDraft.memberIds.length">{{ !groupDraft.name ? '请填写群名' : groupDraft.memberIds.length ? '创建' : '至少选择一位联系人' }}</button></div>
            </form>
          </template>
          <template v-else-if="modal === 'leave-group'"><p>退出后将不再接收此群组的消息</p><button class="logout" @click="leaveGroup">退出群组</button><button class="secondary" @click="modal = ''">取消</button></template>
          <template v-else-if="modal === 'add-group-members'">
            <label class="field"><app-icon name="Search"></app-icon><input v-model.trim="memberDraft.search" aria-label="搜索联系人" placeholder="搜索联系人"></label>
            <div class="group-selection"><label v-for="person in matchingGroupContacts" :key="person.id" class="row slim"><input type="checkbox" v-model="memberDraft.ids" :value="person.id"><span>{{ person.name }}</span></label></div>
            <p v-if="!availableGroupContacts.length" class="empty">没有可添加的联系人</p><p v-else-if="!matchingGroupContacts.length" class="empty">无搜索结果</p>
            <div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" :disabled="!memberDraft.ids.length" @click="addGroupMembers">添加</button></div>
          </template>
          <template v-else-if="modal === 'group-member-actions'"><button class="row" @click="open('contact', managedMember.id)">个人信息</button><button class="row" @click="changeGroupMemberRole">{{ managedIsAdmin ? '取消管理员' : '设为管理员' }}</button><button class="row" @click="modal = 'remove-group-member'">移除成员</button><button class="secondary" @click="modal = ''">取消</button></template>
          <template v-else-if="modal === 'remove-group-member'"><p>{{ managedMember?.name }}</p><div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" @click="removeGroupMember">移除</button></div></template>
          <template v-else-if="modal === 'open-red'">
            <div class="red-hero"><span class="large-red" aria-hidden="true">🧧</span><strong>{{ selectedRed.sender }}的红包</strong><p>{{ redCaption(selectedRed) }}</p><button class="red-open" aria-label="拆开红包" @click="claimRed">开</button></div>
            <button v-if="selectedRed.mine" class="text-btn" @click="modal = 'receive-red'">查看领取记录</button>
            <button class="text-btn" @click="modal = ''">关闭</button>
          </template>
          <template v-else-if="modal === 'receive-red'">
            <div class="red-hero"><span class="large-red" aria-hidden="true">🧧</span><strong>{{ selectedRed.sender }}的红包</strong><p>{{ redCaption(selectedRed) }}</p><span>{{ redDetailStatus(selectedRed) }}</span><b v-if="selectedRed.mine || selectedRed.claimed" class="red-amount">¥ {{ money(selectedRed.claimed ? selectedRed.receivedCents : selectedRed.cents) }}</b><small v-if="selectedRed.claimed">已计入我的钱包</small></div>
            <div><h3 class="red-list-title">领取记录</h3><p class="muted">已领 {{ selectedRed.claims.length }}/{{ selectedRed.count }} 个，共 ¥ {{ money(redReceivedTotal) }}/{{ money(selectedRed.cents) }}</p><div v-for="(entry, index) in selectedRed.claims" :key="index" class="row slim"><span class="avatar">{{ entry.name[0] }}</span><span class="grow">{{ entry.name }}</span><b>¥ {{ money(entry.cents) }}</b></div><p v-if="!selectedRed.claims.length" class="empty">暂无领取记录</p></div>
            <button v-if="canClaimRed(selectedRed)" class="primary" @click="modal = 'open-red'">领取红包</button>
            <button class="secondary" @click="modal = ''">关闭</button>
          </template>
          <template v-else-if="modal === 'redeem-points'">
            <div class="shop-order"><img :src="shopPhoto(redeemItem)" alt=""><div><strong>{{ redeemItem.name }}</strong><span>{{ redeemItem.points }} 积分</span></div></div>
            <form class="form-stack compact" @submit.prevent="redeemPoints">
              <label class="labeled">收货人<input v-model.trim="shippingDraft.name" maxlength="30" required autocomplete="off"></label>
              <label class="labeled">手机号<input v-model.trim="shippingDraft.phone" type="tel" maxlength="11" required autocomplete="off"></label>
              <label class="labeled">详细地址<textarea v-model.trim="shippingDraft.address" rows="2" maxlength="160" required autocomplete="off"></textarea></label>
              <p v-if="shippingError" class="error" role="alert">{{ shippingError }}</p>
              <div class="actions"><button type="button" class="secondary" @click="modal = ''">取消</button><button class="primary">确认兑换</button></div>
            </form>
          </template>
          <template v-else-if="modal === 'draw-result'">
            <div class="draw-result"><span v-if="!drawResult.prize.noPrize">恭喜获得</span><strong>{{ drawResult.prize.name }}</strong></div>
            <button class="primary" @click="modal = ''">确定</button>
          </template>
          <template v-else-if="modal === 'attachment'"><p class="muted">{{ activeAttachment.size }}</p><a v-if="activeAttachment.url" class="primary download" :href="activeAttachment.url" :download="activeAttachment.text">文件</a><button class="secondary" @click="modal = ''">确定</button></template>
          <template v-else-if="modal === 'message-menu'">
            <div class="quick-reactions" role="group" aria-label="快捷表情回应">
              <button v-for="[glyph, label] in quickReactions" :key="glyph" :aria-label="label" :aria-pressed="!!currentMessage.reactions?.some(reaction => reaction.glyph === glyph)" @click="chooseReaction(glyph, label)">{{ glyph }}</button>
              <button :aria-label="reactionPickerOpen ? '收起更多表情' : '更多表情'" :aria-expanded="reactionPickerOpen" @click="reactionPickerOpen = !reactionPickerOpen; reactionSearch = ''"><app-icon :name="reactionPickerOpen ? 'X' : 'Plus'"></app-icon></button>
            </div>
            <div v-if="reactionPickerOpen" class="reaction-picker">
              <label class="field"><app-icon name="Search"></app-icon><input v-model="reactionSearch" aria-label="搜索表情" placeholder="搜索"></label>
              <div v-if="recentReactions.length && !reactionSearch.trim()" class="reaction-grid" role="group" aria-label="最近使用"><button v-for="[glyph, label] in recentReactions" :key="glyph" :aria-label="label" @click="chooseReaction(glyph, label)">{{ glyph }}</button></div>
              <div v-if="visibleReactions.length" class="reaction-grid" role="group" aria-label="更多表情"><button v-for="[glyph, label] in visibleReactions" :key="glyph" :aria-label="label" :aria-pressed="!!currentMessage.reactions?.some(reaction => reaction.glyph === glyph)" @click="chooseReaction(glyph, label)">{{ glyph }}</button></div>
              <p v-else class="empty">无搜索结果</p>
            </div>
            <template v-else>
            <button class="row" @click="prepareMessageComposer(false)">回复</button>
            <button class="row" @click="copyMessage">复制</button>
            <button class="row" @click="openMessageForward">转发</button>
            <button class="row" @click="if (!favorites.some(entry => entry.id === currentMessage.id)) favorites.push(currentMessage); modal = ''; ">收藏</button>
            <button v-if="currentMessage.mine && currentMessage.delivery !== 'failed'" class="row" @click="prepareMessageComposer(true)">编辑</button>
            <button v-if="currentMessage.mine" class="row" @click="recallMessage">撤回</button>
            <button class="row" @click="startMessageSelection">选择</button>
            <button class="secondary" @click="modal = ''">取消</button>
            </template>
          </template>
          <template v-else-if="modal === 'delete-message'"><p>这些消息将从您的聊天记录中删除，且无法恢复</p><div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" @click="deleteMessage">删除</button></div></template>
          <template v-else-if="modal === 'edit-nickname'"><form class="form-stack" @submit.prevent="saveNickname"><label class="labeled"><input ref="nicknameInput" v-model="nicknameDraft" aria-label="昵称" maxlength="50" autocomplete="off" aria-describedby="nickname-count"><span id="nickname-count" class="muted nickname-count">{{ nicknameDraft.length }}/50</span></label><div class="actions"><button type="button" class="secondary" @click="modal = ''">取消</button><button class="primary" :disabled="!nicknameDraft.trim()">保存</button></div></form></template>
          <template v-else-if="modal === 'avatar-source'"><button class="row" @click="pickAvatar('camera')">拍照</button><button class="row" @click="pickAvatar('gallery')">从相册选择</button><button class="secondary" @click="modal = ''">取消</button></template>
          <template v-else-if="modal === 'avatar-crop'"><img class="crop-preview" :src="avatarPreview" alt=""><div class="actions"><button class="secondary" @click="modal = ''">取消</button><button class="primary" @click="saveAvatar">确定</button></div></template>
          <template v-else-if="modal === 'withdraw-method'">
            <button v-for="method in payoutMethods" :key="method.id" class="row" @click="chooseWithdrawMethod(method)">
              <span class="grow">{{ method.label }}</span><span class="muted">{{ payoutAccountLabel(method) }}</span><app-icon name="ChevronRight"></app-icon>
            </button>
            <button class="secondary" @click="modal = ''">取消</button>
          </template>
          <template v-else-if="modal === 'withdraw-account-required'"><p>尚未保存{{ pendingPayout.label }}的收款资料，请先补充提现信息。</p><div class="actions"><button class="secondary" @click="pendingPayout = null; modal = ''">取消</button><button class="primary" @click="openWithdrawAccount(pendingPayout)">去补充</button></div></template>
          <template v-else-if="modal === 'withdraw-success'"><div class="row"><span class="grow">提现至</span><b>{{ selectedPayout?.label }}</b></div><div class="row"><span class="grow">提现金额</span><b>¥ {{ withdrawReceipt }}</b></div><button class="primary" @click="modal = ''">确定</button></template>
        </div>
      </div>
      <div v-if="notice" class="toast" role="status">{{ notice }}</div>
    </main>
  </div>
</body>
</html>
